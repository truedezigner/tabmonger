map $arg_analytics $tabmonger_analytics_cookie {
  default "";
  off "tm_analytics=off; Max-Age=31536000; Path=/; Secure; SameSite=Lax";
  on "tm_analytics=; Max-Age=0; Path=/; Secure; SameSite=Lax";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
  add_header Set-Cookie $tabmonger_analytics_cookie always;

  location = /api/community/poll {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  location = /api/community/submissions {
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  location = /api/community/vote {
    client_max_body_size 2k;
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  location = /api/analytics/event {
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  location ^~ /metrics {
    return 404;
  }

  location ^~ /api/ {
    return 404;
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  location ~* \.(?:css|js|svg|png|webp|woff2)$ {
    expires 7d;
  }

  location = /community.js {
    expires -1;
  }

  location = /site-analytics.js {
    expires -1;
  }

  location = /index.html {
    expires 5m;
  }
}

server {
  listen 8082;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  allow 127.0.0.1;
  allow 10.0.0.0/8;
  allow 172.16.0.0/12;
  allow 192.168.0.0/16;
  deny all;

  add_header Cache-Control "private, no-store" always;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

  location = /api/analytics/report {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  location = /metrics {
    return 302 /metrics/;
  }

  location ^~ /metrics/ {
    try_files $uri $uri/ =404;
  }

  location / {
    return 404;
  }
}
