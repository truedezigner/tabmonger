name: Feature request
description: Suggest a focused improvement that fits TabMonger’s local-first design.
title: "[Idea]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the smallest useful version.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard
        - Local server
        - Browser extension
        - Installer or packaging
        - Documentation
        - Public website
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Project fit
      options:
        - label: This can work without telemetry, a required cloud account, or remote plugin code.
          required: true
